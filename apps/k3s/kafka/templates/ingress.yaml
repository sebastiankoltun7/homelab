apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: redpanda-console-ingress
  namespace: kafka
  annotations:
    kubernetes.io/ingress.class: "traefik"
spec:
  rules:
    - host: redpanda.k3s.skoltun.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: redpanda-console
                port:
                  number: 8080