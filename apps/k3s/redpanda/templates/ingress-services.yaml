{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: redpanda-services-ingress
  namespace: {{ .Release.Namespace }}
spec:
  ingressClassName: "traefik"  # Replaces kubernetes.io/ingress.class annotation
  rules:
    - host: schema-registry.k3s.skoltun.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: redpanda
                port:
                  number: 8081
    - host: pandas.k3s.skoltun.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: redpanda
                port:
                  number: 8082
{{- end }}