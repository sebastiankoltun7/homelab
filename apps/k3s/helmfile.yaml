# Helmfile state for the K3s cluster (192.168.1.104).
repositories:
  - name: headlamp
    url: https://kubernetes-sigs.github.io/headlamp/
  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts
  - name: jetstack
    url: https://charts.jetstack.io
  - name: emberstack
    url: https://emberstack.github.io/helm-charts
  - name: redpanda
    url: https://charts.redpanda.com

helmDefaults:
  wait: true
  timeout: 600

releases:
  - name: reflector
    namespace: cert-manager
    chart: emberstack/reflector

  - name: cert-manager
    namespace: cert-manager
    createNamespace: true
    chart: jetstack/cert-manager
    version: v1.14.3
    set:
      - name: installCRDs
        value: true

  - name: headlamp
    installed: true
    namespace: headlamp
    createNamespace: true
    chart: headlamp/headlamp
    version: '{{ env "HEADLAMP_CHART_VERSION" | default "0.45.0" }}'
    disableValidation: true
    values:
      - headlamp/values.yaml

  - name: monitoring
    installed: true
    namespace: monitoring
    createNamespace: true
    chart: prometheus-community/kube-prometheus-stack
    version: '{{ env "MONITORING_CHART_VERSION" | default "91.8.1" }}'
    disableValidation: true
    values:
      - monitoring/values.yaml

  - name: redpanda
    installed: true
    namespace: kafka
    createNamespace: true
    chart: redpanda/redpanda
    disableValidation: true
    values:
      - redpanda/values.yaml

  - name: redpanda-ingress
    installed: true
    namespace: kafka
    chart: ./kafka