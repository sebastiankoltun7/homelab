---
- name: Deploy and Configure Plex Media Server Stack
  hosts: pve
  gather_facts: false

  vars:
    plex_vmid: "{{ hostvars['plex-host'].proxmox_vmid }}"
    plex_data: "{{ hostvars['plex-host'].plex }}"

    plex_mounts:
      - id: "{{ plex_data.mounts.media.id }}"
        host_path: "{{ plex_data.mounts.media.host_path }}"
        container_path: "{{ plex_data.mounts.media.container_path }}"
      - id: "{{ plex_data.mounts.config.id }}"
        host_path: "{{ plex_data.mounts.config.host_path }}"
        container_path: "{{ plex_data.mounts.config.container_path }}"

  tasks:
    - name: Ensure external disks configuration is provided
      ansible.builtin.fail:
        msg: "Set `external_disks` in ansible/group_vars/pve.yml"
      when: external_disks | default([]) | length == 0

    - name: Configure each external disk
      ansible.builtin.include_tasks: "../tasks/configure_external_disk.yml"
      loop: "{{ external_disks }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Configure LXC bind mounts for Plex container
      ansible.builtin.include_tasks: "../tasks/configure_lxc_bind_mounts.yml"
      vars:
        lxc_vmid: "{{ plex_vmid }}"
        lxc_name: "Plex"
        lxc_mounts: "{{ plex_mounts }}"
        lxc_restart_handler: "Restart plex container"

  handlers:
    - name: Stop plex container
      ansible.builtin.command: pct stop {{ plex_vmid }}
      listen: "Restart plex container"
      changed_when: true

    - name: Start plex container
      ansible.builtin.command: pct start {{ plex_vmid }}
      listen: "Restart plex container"
      changed_when: true


- name: Install and Configure Plex Media Server inside LXC
  hosts: role_plex
  gather_facts: false

  tasks:
    - name: Verify external mounts are present
      ansible.builtin.command: findmnt -n {{ item }}
      loop:
        - "{{ plex.mounts.media.container_path }}"
        - "{{ plex.mounts.config.container_path }}"
      changed_when: false
      failed_when: mount_check.rc != 0
      register: mount_check

    - name: Add Plex apt repository
      ansible.builtin.copy:
        content: "{{ plex.apt.repo }}\n"
        dest: "{{ plex.apt.repo_file }}"
        mode: "0644"

    - name: Install dependencies
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
        state: present
        update_cache: true

    - name: Install Plex Media Server
      ansible.builtin.apt:
        name: "{{ plex.package_name }}"
        state: present
        update_cache: true

    - name: Ensure systemd override directory exists
      ansible.builtin.file:
        path: "{{ plex.service.override_dir }}"
        state: directory
        mode: "0755"

    - name: Configure Plex data directory on external disk
      ansible.builtin.copy:
        content: |
          [Service]
          Environment="PLEX_MEDIA_SERVER_APPLICATION_SUPPORT_DIR={{ plex.mounts.config.container_path }}"
        dest: "{{ plex.service.override_file }}"
        mode: "0644"
      notify: Reload and restart Plex Media Server

    - name: Enable and start Plex Media Server
      ansible.builtin.systemd:
        name: "{{ plex.package_name }}"
        state: started
        enabled: true

  handlers:
    - name: Reload and restart Plex Media Server
      ansible.builtin.systemd:
        name: "{{ plex.package_name }}"
        state: restarted
        daemon_reload: true