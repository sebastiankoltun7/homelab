---
- name: Deploy and Configure Plex Media Server Stack
  hosts: pve
  gather_facts: false

  vars:
    # Dynamically pull VMID from inventory
    plex_vmid: "{{ hostvars[groups['role_plex'][0]]['proxmox_vmid'] }}"
    plex_config_file: "/etc/pve/lxc/{{ plex_vmid }}.conf"

    plex_mounts:
      - id: "mp0"
        host_path: "/mnt/pve/ssd-backup/PlexMedia"
        container_path: "/PlexMedia"
      - id: "mp1"
        host_path: "/mnt/pve/ssd-backup/PlexConfig"
        container_path: "/plex-config"

  tasks:
    - name: Ensure external disks configuration is provided
      ansible.builtin.fail:
        msg: "Set `external_disks` in ansible/group_vars/pve.yml"
      when: external_disks | default([]) | length == 0

    - name: Configure each external disk
      ansible.builtin.include_tasks: "../tasks/configure_external_disk.yml"
      loop: "{{ external_disks }}"
      loop_control:
        label: "{{ item.name }}"

    # --- Proxmox LXC Configuration (Bind Mounts) ---
    - name: Ensure the plex container config exists
      ansible.builtin.stat:
        path: "{{ plex_config_file }}"
      register: plex_cfg

    - name: Fail when the plex container was not created
      ansible.builtin.fail:
        msg: "Container {{ plex_vmid }} is missing. Run `mise run tf-apply` first."
      when: not plex_cfg.stat.exists

    - name: Read current container config
      ansible.builtin.command: cat {{ plex_config_file }}
      register: plex_conf
      changed_when: false

    - name: Apply bind mount points via pct
      ansible.builtin.command: >
        pct set {{ plex_vmid }}
        --{{ item.id }} {{ item.host_path }},mp={{ item.container_path }}
      loop: "{{ plex_mounts }}"
      loop_control:
        label: "{{ item.id }}: {{ item.host_path }} -> {{ item.container_path }}"
      when: plex_conf.stdout.find(item.id ~ ':') == -1
      notify: Restart plex container

  handlers:
    - name: Stop plex container
      ansible.builtin.command: pct stop {{ plex_vmid }}
      listen: Restart plex container
      changed_when: true
    - name: Start plex container
      ansible.builtin.command: pct start {{ plex_vmid }}
      listen: Restart plex container
      changed_when: true


- name: Install and Configure Plex Media Server inside LXC
  hosts: role_plex
  gather_facts: false

  vars:
    plex_media_mount: "/PlexMedia"
    plex_config_mount: "/plex-config"
    plex_override_dir: "/etc/systemd/system/plexmediaserver.service.d"
    plex_override_file: "/etc/systemd/system/plexmediaserver.service.d/override.conf"
    plex_apt_repo_file: "/etc/apt/sources.list.d/plexmediaserver.list"
    plex_apt_repo: "deb [trusted=yes] https://downloads.plex.tv/repo/deb public main"

  tasks:
    - name: Verify external mounts are present
      ansible.builtin.command: findmnt -n {{ item }}
      loop:
        - "{{ plex_media_mount }}"
        - "{{ plex_config_mount }}"
      changed_when: false
      failed_when: mount_check.rc != 0
      register: mount_check

    - name: Add Plex apt repository
      ansible.builtin.copy:
        content: "{{ plex_apt_repo }}\n"
        dest: "{{ plex_apt_repo_file }}"
        mode: "0644"

    - name: Install dependencies
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
        state: present
        update_cache: true

    - name: Install Plex Media Server
      ansible.builtin.apt:
        name: plexmediaserver
        state: present
        update_cache: true

    - name: Ensure systemd override directory exists
      ansible.builtin.file:
        path: "{{ plex_override_dir }}"
        state: directory
        mode: "0755"

    - name: Configure Plex data directory on external disk
      ansible.builtin.copy:
        content: |
          [Service]
          Environment="PLEX_MEDIA_SERVER_APPLICATION_SUPPORT_DIR=/plex-config"
        dest: "{{ plex_override_file }}"
        mode: "0644"
      notify: Reload and restart Plex Media Server

    - name: Enable and start Plex Media Server
      ansible.builtin.systemd:
        name: plexmediaserver
        state: started
        enabled: true

  handlers:
    - name: Reload and restart Plex Media Server
      ansible.builtin.systemd:
        name: plexmediaserver
        state: restarted
        daemon_reload: true