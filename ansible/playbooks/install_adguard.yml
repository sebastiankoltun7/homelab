---
- name: AdGuard Home installation
  hosts: role_adguard
  gather_facts: false

  tasks:
    - name: Ensure configuration directory exists
      ansible.builtin.file:
        path: /opt/AdGuardHome
        state: directory
        mode: '0700'

    - name: Check if AdGuard Home is installed
      ansible.builtin.stat:
        path: /opt/AdGuardHome/AdGuardHome
      register: adguard_binary

    - name: Install AdGuard Home
      when: not adguard_binary.stat.exists
      block:
        - name: Download AdGuard Home install script
          ansible.builtin.get_url:
            url: https://raw.githubusercontent.com/AdguardTeam/AdGuardHome/master/scripts/install.sh
            dest: /tmp/install_adguard.sh
            mode: "0755"

        - name: Run AdGuard Home install script
          ansible.builtin.command:
            cmd: /tmp/install_adguard.sh -r
            creates: /opt/AdGuardHome/AdGuardHome

        - name: Remove installation script
          ansible.builtin.file:
            path: /tmp/install_adguard.sh
            state: absent

    - name: Ensure AdGuard certificate directory exists
      ansible.builtin.file:
        path: /opt/AdGuardHome/certs
        state: directory
        mode: '0700'

    - name: Install Certbot and Cloudflare DNS plugin
      ansible.builtin.apt:
        name:
          - certbot
          - python3-certbot-dns-cloudflare
        state: present
        update_cache: true

    - name: Create Cloudflare credentials file for Certbot
      ansible.builtin.copy:
        content: "dns_cloudflare_api_token = {{ cloudflare_api_token }}\n"
        dest: /opt/AdGuardHome/cloudflare.ini
        mode: '0600'

    - name: Check if Let's Encrypt certificate already exists
      ansible.builtin.stat:
        path: /etc/letsencrypt/live/skoltun.dev/fullchain.pem
      register: le_cert

    - name: Generate wildcard Let's Encrypt certificate via DNS-01
      when: not le_cert.stat.exists
      ansible.builtin.command:
        cmd: >
          certbot certonly --dns-cloudflare
          --dns-cloudflare-credentials /opt/AdGuardHome/cloudflare.ini
          -d skoltun.dev
          -d "*.skoltun.dev"
          --non-interactive --agree-tos -m admin@skoltun.dev

    - name: Copy fullchain certificate to AdGuard cert directory
      ansible.builtin.copy:
        src: /etc/letsencrypt/live/skoltun.dev/fullchain.pem
        dest: "{{ adguard_cert_directory }}/cert.crt"
        remote_src: true
        mode: '0644'

    - name: Copy private key to AdGuard cert directory
      ansible.builtin.copy:
        src: /etc/letsencrypt/live/skoltun.dev/privkey.pem
        dest: "{{ adguard_cert_directory }}/private.key"
        remote_src: true
        mode: '0600'
        owner: root
        group: root

    - name: Deploy AdGuardHome.yaml
      ansible.builtin.template:
        src: "{{ playbook_dir }}/adguard/AdGuardHome.yml.j2"
        dest: /opt/AdGuardHome/AdGuardHome.yaml
        mode: '0644'
      notify: Restart AdGuard Home

    - name: Enable and start AdGuard Home service
      ansible.builtin.systemd:
        name: AdGuardHome
        state: started
        enabled: true

  handlers:
    - name: Restart AdGuard Home
      ansible.builtin.systemd:
        name: AdGuardHome
        state: restarted