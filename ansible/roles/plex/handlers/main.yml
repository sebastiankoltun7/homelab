---
- name: Stop plex container
  ansible.builtin.command: pct stop {{ hostvars['plex-host'].proxmox_vmid }}
  listen: "Restart plex container"
  changed_when: true

- name: Start plex container
  ansible.builtin.command: pct start {{ hostvars['plex-host'].proxmox_vmid }}
  listen: "Restart plex container"
  changed_when: true

- name: Reload and restart Plex Media Server
  ansible.builtin.systemd:
    name: "{{ plex.package_name }}"
    state: restarted
    daemon_reload: true