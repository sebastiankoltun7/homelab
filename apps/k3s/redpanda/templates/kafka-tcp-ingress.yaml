{{- if .Values.ingress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: redpanda-kafka-tcp
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - kafka
  routes:
    - match: HostSNI(`*`)
      services:
        - name: redpanda-external
          port: 9094
{{- end }}