services:
  minio:
    image: docker.io/pgsty/silo:latest
    container_name: minio
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      GOMEMLIMIT: 400MiB
      VIRTUAL_HOST_MULTIPORTS: |-
        minio.${DOMAIN}:
          "/":
            port: 9001
        s3.minio.${DOMAIN}:
          "/":
            port: 9000
    volumes:
      - minio_data:/data
    networks:
      - proxy-net
    command: server /data --console-address ":9001"
    deploy:
      replicas: 1
      labels: ["minio"]
      resources:
        limits:
          memory: 512M
          cpus: 2

volumes:
  minio_data:

networks:
  proxy-net:
    external: true