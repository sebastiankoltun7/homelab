redpanda:
  statefulset:
    replicas: 1

  tls:
    enabled: false

  external:
    enabled: false

  console:
    enabled: true
    ingress:
      enabled: true
      className: traefik
      hosts:
        - host: redpanda.k3s.skoltun.dev
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: wildcard-skoltun-tls
          hosts:
            - redpanda.k3s.skoltun.dev

  monitoring:
    enabled: false

  resources:
    cpu:
      cores: 1
    memory:
      container:
        max: "2.5Gi"

  storage:
    persistentVolume:
      enabled: true
      size: 10Gi

ingress:
  enabled: false