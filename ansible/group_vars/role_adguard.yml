# AdGuard Home Configuration
adguard:
  http_address: "{{ container_ip }}:80"
  docker_reverse_proxy_ip: "{{ hostvars['docker-host'].ansible_host }}"
  dns_ipv6: true
  admin_username: "{{ admin_username }}"
  dns_rewrites:
    "adguard.homelab": "{{ container_ip }}"
    "plex.homelab": "{{ hostvars['plex-host'].container_ip }}"
    "*.docker.skoltun.dev": "{{ hostvars['docker-host'].ansible_host }}"
    "*.k3s.skoltun.dev": "{{ hostvars['k3s-node'].ansible_host }}"