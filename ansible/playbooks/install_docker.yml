---
- name: Docker installation and configuration
  hosts: role_docker
  become: true

  tasks:
    - name: Create mount point
      ansible.builtin.file:
        path: "{{ docker_mount_point }}"
        state: directory
        mode: "0755"

    - name: Format docker data disk
      community.general.filesystem:
        fstype: ext4
        dev: "{{ docker_disk_id }}"
        force: false

    - name: Mount docker data disk
      ansible.posix.mount:
        path: "{{ docker_mount_point }}"
        src: "{{ docker_disk_id }}"
        fstype: ext4
        opts: discard,defaults
        state: mounted

    - name: Ensure dedicated directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0711"
      loop:
        - "{{ docker_engine_root }}"
        - "{{ containerd_root }}"

    - name: Run Docker installation role
      ansible.builtin.include_role:
        name: geerlingguy.docker
      vars:
        docker_daemon_config: "{{ docker_daemon_options }}"
        docker_install_compose: true
        docker_compose_package: docker-compose-plugin
        docker_users: ["{{ ansible_user }}"]

    - name: Configure containerd root directory
      ansible.builtin.copy:
        content: |
          version = 2
          root = "{{ containerd_root }}"
        dest: /etc/containerd/config.toml
        owner: root
        group: root
        mode: "0644"
      notify: Restart containerd

    - name: Ensure proxy-net exists
      community.docker.docker_network:
        name: proxy-net
        driver: bridge
        state: present

    - name: Configure docker cleanup
      ansible.builtin.include_tasks: ../tasks/docker_cleanup_cron.yml

    - name: Configure Docker daemon options (DNS and Insecure Registries)
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "dns": [
              "192.168.1.101"
            ],
            "insecure-registries": [
              "docker.registry.internal",
              "quay.registry.internal",
              "ghcr.registry.internal",
              "k8s.registry.internal"
            ]
          }
        mode: "0644"
      notify: Restart Docker

  handlers:
    - name: Restart containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted
        daemon_reload: true

    - name: Restart Docker
      ansible.builtin.systemd:
        name: docker
        state: restarted
